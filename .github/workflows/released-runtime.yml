name: Released portable R lifecycle gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/released-runtime.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/windows-shell/**"
      - "crates/launcher-protocol/**"
      - "crates/resource-bundle/**"
      - "crates/windows-launcher/**"
      - "crates/windows-lifecycle/**"
      - "crates/windows-webview/**"
      - "tests/cleanup-released-runtime.ps1"
      - "tests/prepare-released-runtime.R"
      - "tests/prepare-released-runtime.ps1"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: released-portable-r-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RPACKIT_RUNTIME_VERSION: "4.6.1"
  RPACKIT_RUNTIME_URL: "https://github.com/rpackit/runtime-win/releases/download/v4.6.1-r1/portable-r-windows-x86_64-4.6.1.zip"
  RPACKIT_RUNTIME_SHA256: "a452f127c9aea16a9ebbd9794e55521dfffefc527a862ad15220c6c2c46b6419"
  RPACKIT_RUNTIME_HOME: "portable-r-windows-x86_64-4.6.1"
  RPACKIT_PACKAGE_SHA: "27d6dc38f3bb1dcc96993c6f151243ab34c43abd"
  RPACKIT_EXAMPLES_SHA: "385807ab418ece8875deb321db4878594882868e"
  RPACKIT_CRAN_REPOSITORY: "https://cloud.r-project.org"

jobs:
  released-runtime:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pinned rpackit package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rpackit/rpackit
          ref: ${{ env.RPACKIT_PACKAGE_SHA }}
          path: gate-inputs/rpackit

      - name: Check out pinned hello-shiny source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rpackit/rpackit-examples
          ref: ${{ env.RPACKIT_EXAMPLES_SHA }}
          path: gate-inputs/examples

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          r-version: release
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - name: Configure runner-scoped storage
        shell: powershell
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP (
            "rpackit-released-runtime-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          )
          @(
            "RPACKIT_GATE_WORK_ROOT=$workRoot",
            "RPACKIT_RELEASE_BUNDLE=$(Join-Path $workRoot 'hello-shiny bundle')",
            "RPACKIT_RELEASE_SESSIONS=$(Join-Path $workRoot 'private sessions')",
            "RPACKIT_RELEASE_EVIDENCE=$(Join-Path $workRoot 'evidence\lifecycle-evidence.json')",
            "RPACKIT_SHELL_EVIDENCE=$(Join-Path $workRoot 'evidence\native-shell-evidence.json')",
            "RPACKIT_SHELL_PROFILES=$(Join-Path $workRoot 'webview profiles')",
            "RPACKIT_PROFILE_MARKER=$(Join-Path $workRoot 'ambient-profile-executed')",
            "CARGO_TARGET_DIR=$(Join-Path $workRoot 'cargo target')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare verified released runtime and hello-shiny bundle
        shell: powershell
        run: |
          .\tests\prepare-released-runtime.ps1 `
            -WorkRoot "$env:RPACKIT_GATE_WORK_ROOT" `
            -RpackitSource ".\gate-inputs\rpackit" `
            -ExamplesSource ".\gate-inputs\examples"

      - name: Run the released-runtime lifecycle matrix
        shell: powershell
        run: |
          $env:R_PROFILE_USER = Join-Path $env:RPACKIT_GATE_WORK_ROOT `
            "hostile ambient profile.R"
          $env:R_ENVIRON_USER = Join-Path $env:RPACKIT_GATE_WORK_ROOT `
            "hostile ambient Renviron"
          $env:RPACKIT_SESSION_TOKEN = "ambient-legacy-token-must-not-survive"
          cargo test `
            -p rpackit-windows-lifecycle `
            --test released_runtime `
            --locked `
            -- `
            --ignored `
            --exact released_portable_r_and_hello_shiny_pass_lifecycle_matrix `
            --nocapture

      - name: Build the native Tauri application shell
        shell: powershell
        run: |
          cargo build `
            -p rpackit-windows-shell `
            --locked

      - name: Run real R through the native Tauri WebView owner
        shell: powershell
        run: |
          $null = New-Item `
            -ItemType Directory `
            -Path "$env:RPACKIT_SHELL_PROFILES"
          $shell = Join-Path `
            "$env:CARGO_TARGET_DIR" `
            "debug\rpackit-windows-shell.exe"
          & $shell `
            --bundle "$env:RPACKIT_RELEASE_BUNDLE" `
            --session-parent "$env:RPACKIT_RELEASE_SESSIONS" `
            --profile-parent "$env:RPACKIT_SHELL_PROFILES" `
            --evidence "$env:RPACKIT_SHELL_EVIDENCE" `
            --close-after-ready
          if ($LASTEXITCODE -ne 0) {
            throw "The native Tauri WebView owner failed."
          }
          $report = Get-Content `
            -LiteralPath "$env:RPACKIT_SHELL_EVIDENCE" `
            -Raw | ConvertFrom-Json
          foreach ($gate in @(
            "success",
            "graceful_runtime_shutdown",
            "proxy_stopped",
            "job_empty",
            "private_session_removed",
            "session_cookie_absent",
            "browsing_data_clear_queued",
            "window_destroyed",
            "profile_removed"
          )) {
            if ($report.$gate -ne $true) {
              throw "The native Tauri WebView report failed a required gate."
            }
          }
          if (@(
            Get-ChildItem `
              -LiteralPath "$env:RPACKIT_RELEASE_SESSIONS" `
              -Force
          ).Count -ne 0) {
            throw "The native Tauri shell retained a private R session."
          }
          if (@(
            Get-ChildItem `
              -LiteralPath "$env:RPACKIT_SHELL_PROFILES" `
              -Force
          ).Count -ne 0) {
            throw "The native Tauri shell retained a WebView profile."
          }

      - name: Verify evidence is small and secret-free
        if: always()
        shell: powershell
        run: |
          $evidenceDirectory = Join-Path $env:RPACKIT_GATE_WORK_ROOT "evidence"
          if (-not (Test-Path -LiteralPath $evidenceDirectory -PathType Container)) {
            throw "The released-runtime evidence directory is missing."
          }
          $files = @(
            Get-ChildItem -LiteralPath $evidenceDirectory -Filter "*.json" -File
          )
          if ($files.Count -ne 3) {
            throw "Exactly three released-runtime evidence files are required."
          }
          foreach ($file in $files) {
            if ($file.Length -gt 65536) {
              throw "Released-runtime evidence exceeded 64 KiB."
            }
            $text = Get-Content -LiteralPath $file.FullName -Raw
            $null = $text | ConvertFrom-Json
            foreach ($forbidden in @(
              "Shiny-Shared-Secret",
              "RPACKIT_SESSION_TOKEN",
              "ambient-legacy-token-must-not-survive",
              "token-file",
              $env:RUNNER_TEMP
            )) {
              if ($text.Contains($forbidden)) {
                throw "Released-runtime evidence contained forbidden data."
              }
            }
            if ($text -match "[A-Za-z]:\\\\") {
              throw "Released-runtime evidence contained a Windows path."
            }
          }

      - name: Upload secret-free released-runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: released-portable-r-hello-shiny-evidence
          path: ${{ runner.temp }}\rpackit-released-runtime-${{ github.run_id }}-${{ github.run_attempt }}\evidence\*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove all released-runtime runner storage
        if: always()
        shell: powershell
        run: |
          .\tests\cleanup-released-runtime.ps1 `
            -WorkRoot "$env:RPACKIT_GATE_WORK_ROOT"
